<!-- Animated Welcome Section -->
<div class="welcome-wrap">
  <p class="welcome-greeting">Welcome to my site</p>
  <h1 class="welcome-name">Hi, I'm Joaquin! 👋</h1>
  <p class="welcome-typewriter"><span id="typed"></span><span class="cursor"></span></p>
  <div class="welcome-dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>

<style>
  .welcome-wrap {
    background: linear-gradient(135deg, #400865 0%, #6a0dad 100%);
    border-radius: 8px;
    padding: 36px 28px;
    margin-bottom: 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .welcome-wrap::before {
    content: '';
    position: absolute;
    top: -40px; left: -40px;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    pointer-events: none;
  }
  .welcome-wrap::after {
    content: '';
    position: absolute;
    bottom: -50px; right: -30px;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    pointer-events: none;
  }
  .welcome-greeting {
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #c084fc;
    opacity: 0;
    transform: translateY(-10px);
    animation: fadeSlideIn 0.6s ease forwards 0.2s;
    margin-bottom: 10px;
  }
  .welcome-name {
    font-size: 2.4rem;
    font-weight: bold;
    color: #ffffff;
    margin: 0 0 12px;
    opacity: 0;
    transform: translateY(12px);
    animation: fadeSlideIn 0.7s ease forwards 0.5s;
  }
  .welcome-typewriter {
    font-size: 1.05rem;
    color: #e9d5ff;
    min-height: 1.6em;
    opacity: 0;
    animation: fadeSlideIn 0.6s ease forwards 0.9s;
  }
  .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: #c084fc;
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 0.75s step-end infinite;
  }
  .welcome-dots {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 8px;
    opacity: 0;
    animation: fadeSlideIn 0.5s ease forwards 1.1s;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #c084fc;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; background: #a855f7; }
  .dot:nth-child(3) { animation-delay: 0.4s; background: #7c3aed; }
  @keyframes fadeSlideIn {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.4); opacity: 1; }
  }
</style>

<script>
  const phrases = [
    "11th grader. Coder. Creator.",
    "Into music, tennis & video games.",
    "Building my portfolio one project at a time.",
    "Check out my GitHub below!"
  ];
  let pIndex = 0, cIndex = 0, deleting = false;
  const el = document.getElementById('typed');
  function type() {
    const current = phrases[pIndex];
    if (!deleting) {
      el.textContent = current.slice(0, ++cIndex);
      if (cIndex === current.length) {
        setTimeout(() => { deleting = true; type(); }, 1800);
        return;
      }
    } else {
      el.textContent = current.slice(0, --cIndex);
      if (cIndex === 0) {
        deleting = false;
        pIndex = (pIndex + 1) % phrases.length;
      }
    }
    setTimeout(type, deleting ? 40 : 70);
  }
  setTimeout(type, 1400);
</script>
